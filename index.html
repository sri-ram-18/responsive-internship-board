<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore internship opportunities, search by domain and work mode, and submit an application.">
  <meta name="theme-color" content="#102a43">
  <title>Internship Board | Find Your Next Opportunity</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Find your next opportunity</h1>
    <p>Explore internships, discover roles that match your skills, and apply in a few simple steps.</p>
  </header>

  <main>
    <section aria-labelledby="browse-heading">
      <h2 id="browse-heading" class="section-heading">Explore internships</h2>

      <form id="filters" aria-label="Filter internships">
        <label for="search">Search internships</label>
        <input id="search" type="search" placeholder="Search title, location or skills" autocomplete="off">

        <label for="domain">Domain</label>
        <select id="domain">
          <option value="">All domains</option>
          <option>Full Stack Development</option>
          <option>UI/UX</option>
          <option>Data Analytics</option>
          <option>Cyber Security</option>
        </select>

        <label for="mode">Work mode</label>
        <select id="mode">
          <option value="">All modes</option>
          <option>Remote</option>
          <option>Hybrid</option>
          <option>On-site</option>
        </select>

        <button type="reset">Clear filters</button>
      </form>

      <p id="count" aria-live="polite" aria-atomic="true"></p>
      <section id="internships" aria-label="Internship listings" aria-live="polite"></section>
    </section>

    <section id="application-section" aria-labelledby="application-heading">
      <h2 id="application-heading">Apply for an internship</h2>

      <form id="application-form">
        <label for="internship-id">Internship ID</label>
        <input id="internship-id" name="internshipId"
          placeholder="Example: INT-101" autocomplete="off" required>

        <label for="applicant-name">Full name</label>
        <input id="applicant-name" name="name"
          type="text" maxlength="100" autocomplete="name" required>

        <label for="applicant-email">Email</label>
        <input id="applicant-email" name="email"
          type="email" maxlength="254" autocomplete="email" required>

        <label for="portfolio">Portfolio URL (optional)</label>
        <input id="portfolio" name="portfolioUrl"
          type="url" maxlength="2048" placeholder="https://example.com" autocomplete="url">

        <button id="application-submit" type="submit">Submit application</button>
        <p id="application-status" role="status" aria-live="polite" aria-atomic="true"></p>
      </form>
    </section>
  </main>
</body>
</html>
